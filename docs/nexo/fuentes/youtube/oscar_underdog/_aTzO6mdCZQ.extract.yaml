  - elemento: hats
    parametro: "elemento que conserva los agudos"
    valor: "hats (solo ellos mantienen agudos)"
    tipo: dicho
    timestamp: "01:30"
    cita: "imagine I want to keep this high hats up top."
  - elemento: filtro
    parametro: "auto filter del grupo de lows (cutoff)"
    valor: null
    tipo: en_pantalla
    timestamp: "04:00"
    cita: "bring it down so that it already becomes only about the subs"
  - elemento: filtro
    parametro: "automatizacion del cutoff de lows (no activo la mayor parte; bajar antes del break)"
